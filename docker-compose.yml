services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data-detective-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - STORAGE_PROVIDER=s3
      - AWS_REGION=ap-south-1
      - AWS_PROFILE=data-detective
      - S3_BUCKET_NAME=data-detective-ai-2026
      - ATHENA_DATABASE=data_detective
      - ATHENA_WORKGROUP=data-detective
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: data-detective-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_uploads:
